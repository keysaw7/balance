version: '3.8'

services:
  # Base de données principale
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: balance
      POSTGRES_USER: balance
      POSTGRES_PASSWORD: balance_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/raw:/data/raw:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balance"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour cache et queues
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://balance:balance_dev@postgres:5432/balance
      - REDIS_URL=redis://redis:6379
      - ZEUS_API_URL=http://zeus:8001
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Modèle Zeus (IA centrale)
  zeus:
    build:
      context: ./backend/zeus
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://balance:balance_dev@postgres:5432/balance
      - REDIS_URL=redis://redis:6379
      - MODEL_PATH=/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/zeus:/app
      - zeus_models:/models
    command: python -m zeus.main --host 0.0.0.0 --port 8001

  # Service de données
  data-service:
    build:
      context: ./backend/data
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://balance:balance_dev@postgres:5432/balance
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/data:/app
      - ./data:/data
    command: python -m data.main --host 0.0.0.0 --port 8002

  # Service de gouvernance
  governance-service:
    build:
      context: ./backend/governance
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://balance:balance_dev@postgres:5432/balance
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/governance:/app
      - ./governance:/governance
    command: python -m governance.main --host 0.0.0.0 --port 8003

  # Interface web
  web-app:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_ZEUS_URL=http://localhost:8001
    depends_on:
      - api-gateway
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning
    depends_on:
      - prometheus

  # Nginx (reverse proxy)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - web-app
      - api-gateway

volumes:
  postgres_data:
  redis_data:
  zeus_models:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: balance-network
